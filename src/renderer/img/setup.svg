<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Fundo da aba PC: um setup gamer à noite, com o monitor aceso e luz de LED na parede. Desenho do próprio Cartucho. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1226"/><stop offset=".72" stop-color="#121a38"/><stop offset="1" stop-color="#070a16"/>
    </linearGradient>
    <radialGradient id="glowL" cx=".3" cy=".42" r=".45">
      <stop offset="0" stop-color="#6a3cff" stop-opacity=".55"/><stop offset="1" stop-color="#6a3cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx=".78" cy=".38" r=".4">
      <stop offset="0" stop-color="#00c2ff" stop-opacity=".45"/><stop offset="1" stop-color="#00c2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6cff"/><stop offset=".5" stop-color="#7b3dff"/><stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f33"/><stop offset="1" stop-color="#0a0d18"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3fa0"/><stop offset=".35" stop-color="#7b3dff"/><stop offset=".7" stop-color="#00c2ff"/><stop offset="1" stop-color="#3dffb0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <rect width="1920" height="1080" fill="url(#glowL)"/>
  <rect width="1920" height="1080" fill="url(#glowR)"/>
  <!-- painéis acústicos na parede -->
  <g fill="#ffffff" opacity=".035">
    <polygon points="1500,170 1560,135 1620,170 1620,240 1560,275 1500,240"/>
    <polygon points="1630,240 1690,205 1750,240 1750,310 1690,345 1630,310"/>
    <polygon points="1500,310 1560,275 1620,310 1620,380 1560,415 1500,380"/>
    <polygon points="1370,240 1430,205 1490,240 1490,310 1430,345 1370,310"/>
  </g>
  <!-- fita de LED atrás da mesa -->
  <rect x="380" y="688" width="1260" height="10" rx="5" fill="url(#led)" filter="url(#blur)" opacity=".9"/>
  <rect x="380" y="690" width="1260" height="4" rx="2" fill="url(#led)"/>
  <!-- prateleira com bonequinhos -->
  <rect x="190" y="300" width="300" height="10" rx="3" fill="#1c2340"/>
  <rect x="215" y="250" width="36" height="50" rx="8" fill="#2a3360"/>
  <circle cx="233" cy="240" r="16" fill="#2a3360"/>
  <rect x="290" y="262" width="60" height="38" rx="6" fill="#232b52"/>
  <rect x="380" y="232" width="26" height="68" rx="5" fill="#2a3360"/>
  <rect x="418" y="246" width="44" height="54" rx="6" fill="#1f2749"/>
  <!-- monitor -->
  <rect x="610" y="250" width="700" height="400" rx="18" fill="#05070f"/>
  <rect x="628" y="268" width="664" height="364" rx="8" fill="url(#screen)" opacity=".9"/>
  <rect x="628" y="268" width="664" height="364" rx="8" fill="url(#screen)" filter="url(#blur)" opacity=".55"/>
  <path d="M628 560 L760 470 L860 530 L1010 420 L1140 500 L1292 430 L1292 632 L628 632 Z" fill="#0b1030" opacity=".55"/>
  <circle cx="1150" cy="350" r="36" fill="#ffd27a" opacity=".85"/>
  <rect x="925" y="650" width="70" height="60" fill="#0b0e1a"/>
  <rect x="860" y="704" width="200" height="14" rx="6" fill="#0b0e1a"/>
  <!-- segundo monitor, de lado -->
  <polygon points="1360,300 1600,330 1600,610 1360,620" fill="#05070f"/>
  <polygon points="1374,316 1588,343 1588,598 1374,606" fill="#0f2a55" opacity=".9"/>
  <g fill="#7cc4ff" opacity=".35"><rect x="1395" y="360" width="150" height="10" rx="4"/><rect x="1395" y="385" width="110" height="10" rx="4"/><rect x="1395" y="410" width="130" height="10" rx="4"/></g>
  <!-- mesa -->
  <rect x="0" y="716" width="1920" height="364" fill="url(#desk)"/>
  <rect x="0" y="716" width="1920" height="6" fill="#262d48"/>
  <!-- teclado com luz -->
  <rect x="700" y="790" width="520" height="70" rx="12" fill="#0d1120"/>
  <rect x="712" y="800" width="496" height="50" rx="8" fill="url(#led)" opacity=".28"/>
  <g fill="#0d1120"><rect x="724" y="806" width="470" height="6" rx="2"/><rect x="724" y="818" width="470" height="6" rx="2"/><rect x="724" y="830" width="470" height="6" rx="2"/></g>
  <!-- mouse e mousepad -->
  <rect x="1260" y="780" width="300" height="120" rx="14" fill="#111628"/>
  <rect x="1400" y="808" width="44" height="66" rx="22" fill="#0a0d18"/>
  <rect x="1418" y="814" width="8" height="16" rx="4" fill="#00c2ff" opacity=".8"/>
  <!-- controle em cima da mesa -->
  <path d="M440 800 q30-26 70-12 h80 q40-14 70 12 q30 30 24 72 q-6 30-36 26 q-22-2-40-30 h-116 q-18 28-40 30 q-30 4-36-26 q-6-42 24-72 z" fill="#151a2e"/>
  <circle cx="490" cy="830" r="12" fill="#0a0d18"/><circle cx="640" cy="826" r="6" fill="#5cb85c" opacity=".7"/><circle cx="656" cy="840" r="6" fill="#d9534f" opacity=".7"/>
  <!-- gabinete com vidro e fans RGB -->
  <rect x="1640" y="380" width="240" height="340" rx="12" fill="#090c18"/>
  <rect x="1656" y="396" width="208" height="308" rx="8" fill="#10152a"/>
  <g fill="none" stroke-width="7">
    <circle cx="1760" cy="460" r="38" stroke="#ff3fa0" opacity=".8"/>
    <circle cx="1760" cy="560" r="38" stroke="#7b3dff" opacity=".8"/>
    <circle cx="1760" cy="660" r="38" stroke="#00c2ff" opacity=".8"/>
  </g>
  <g filter="url(#soft)" fill="none" stroke-width="10" opacity=".6">
    <circle cx="1760" cy="460" r="38" stroke="#ff3fa0"/>
    <circle cx="1760" cy="560" r="38" stroke="#7b3dff"/>
    <circle cx="1760" cy="660" r="38" stroke="#00c2ff"/>
  </g>
  <!-- luminária -->
  <path d="M120 716 L170 520 L250 470" stroke="#1d2440" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M230 455 l70 -20 l20 50 l-70 20 z" fill="#1d2440"/>
  <ellipse cx="300" cy="560" rx="120" ry="200" fill="#ffd27a" opacity=".06" filter="url(#blur)"/>
</svg>
