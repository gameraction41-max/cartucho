<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- Fundo da aba PC: um setup gamer à noite. Monitor ultrawide aceso, gabinete com fans RGB, painéis hexagonais na parede,
       janela com a cidade lá fora e fita de LED embaixo da mesa. Desenho do próprio Cartucho. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f24"/><stop offset=".62" stop-color="#151a3d"/><stop offset="1" stop-color="#090b1a"/>
    </linearGradient>
    <radialGradient id="glowM" cx=".5" cy=".42" r=".5">
      <stop offset="0" stop-color="#7a4dff" stop-opacity=".55"/><stop offset=".5" stop-color="#3a62ff" stop-opacity=".18"/><stop offset="1" stop-color="#3a62ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff3d9a" stop-opacity=".6"/><stop offset="1" stop-color="#ff3d9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#00d0ff" stop-opacity=".55"/><stop offset="1" stop-color="#00d0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1450"/><stop offset=".55" stop-color="#5b2a7c"/><stop offset=".8" stop-color="#d0547a"/><stop offset="1" stop-color="#ff9a6a"/>
    </linearGradient>
    <linearGradient id="game" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f6e"/><stop offset=".45" stop-color="#9b3fa8"/><stop offset=".7" stop-color="#ff7a68"/><stop offset="1" stop-color="#ffc36b"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b45"/><stop offset=".12" stop-color="#14182b"/><stop offset="1" stop-color="#090b16"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d9a"/><stop offset=".33" stop-color="#8a4dff"/><stop offset=".66" stop-color="#00c8ff"/><stop offset="1" stop-color="#3dffb5"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/><stop offset=".4" stop-color="#ffffff" stop-opacity=".02"/><stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="fan" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#0b0d18"/><stop offset=".7" stop-color="#ff3d9a"/><stop offset=".82" stop-color="#8a4dff" stop-opacity=".8"/><stop offset="1" stop-color="#8a4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fanC" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#0b0d18"/><stop offset=".7" stop-color="#00d0ff"/><stop offset=".82" stop-color="#3a62ff" stop-opacity=".8"/><stop offset="1" stop-color="#3a62ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip"><rect x="574" y="314" width="772" height="332" rx="8"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="hexes" width="84" height="146" patternUnits="userSpaceOnUse">
      <path d="M42 0 84 24v49L42 97 0 73V24z" fill="none" stroke="#fff" stroke-opacity=".03" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- parede -->
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <rect width="1920" height="760" fill="url(#hexes)"/>
  <rect width="1920" height="1080" fill="url(#glowM)"/>

  <!-- janela com a cidade, à esquerda -->
  <g>
    <rect x="70" y="90" width="420" height="470" rx="10" fill="url(#sky)"/>
    <circle cx="350" cy="420" r="70" fill="#ffb07a" opacity=".7"/>
    <g fill="#140f33">
      <rect x="70" y="380" width="60" height="180"/><rect x="135" y="330" width="44" height="230"/><rect x="184" y="410" width="70" height="150"/>
      <rect x="258" y="350" width="38" height="210"/><rect x="300" y="440" width="80" height="120"/><rect x="384" y="300" width="50" height="260"/><rect x="438" y="400" width="52" height="160"/>
    </g>
    <g fill="#ffd27a" opacity=".75">
      <rect x="145" y="350" width="6" height="8"/><rect x="160" y="372" width="6" height="8"/><rect x="145" y="400" width="6" height="8"/><rect x="268" y="370" width="6" height="8"/>
      <rect x="268" y="420" width="6" height="8"/><rect x="396" y="320" width="6" height="8"/><rect x="412" y="350" width="6" height="8"/><rect x="396" y="390" width="6" height="8"/>
      <rect x="200" y="430" width="6" height="8"/><rect x="452" y="420" width="6" height="8"/><rect x="88" y="400" width="6" height="8"/>
    </g>
    <rect x="70" y="90" width="420" height="470" rx="10" fill="none" stroke="#2a2f52" stroke-width="18"/>
    <path d="M280 90v470M70 325h420" stroke="#2a2f52" stroke-width="10"/>
    <rect x="70" y="90" width="420" height="470" rx="10" fill="url(#glass)"/>
  </g>

  <!-- painéis hexagonais com luz -->
  <g transform="translate(1340 120)">
    <ellipse cx="190" cy="120" rx="260" ry="170" fill="url(#glowPink)" filter="url(#blur)" opacity=".8"/>
    <g stroke-width="5" stroke-linejoin="round">
      <path d="M60 40 100 17l40 23v46l-40 23-40-23z" fill="#3a1440" stroke="#ff3d9a"/>
      <path d="M140 86l40-23 40 23v46l-40 23-40-23z" fill="#2a1650" stroke="#a24dff"/>
      <path d="M220 40l40-23 40 23v46l-40 23-40-23z" fill="#13254f" stroke="#00c8ff"/>
      <path d="M300 86l40-23 40 23v46l-40 23-40-23z" fill="#0f2f3f" stroke="#3dffb5"/>
      <path d="M140 178l40-23 40 23v46l-40 23-40-23z" fill="#3a1440" stroke="#ff3d9a"/>
    </g>
  </g>

  <!-- prateleira com cartuchos e boneco -->
  <g transform="translate(600 160)">
    <rect x="0" y="120" width="330" height="14" rx="4" fill="#2a2f52"/>
    <rect x="20" y="58" width="40" height="62" rx="5" fill="#d64b4b"/><rect x="26" y="66" width="28" height="22" rx="3" fill="#ffd27a"/>
    <rect x="66" y="58" width="40" height="62" rx="5" fill="#4b7ad6"/><rect x="72" y="66" width="28" height="22" rx="3" fill="#bfe3ff"/>
    <rect x="112" y="58" width="40" height="62" rx="5" fill="#58b85a"/><rect x="118" y="66" width="28" height="22" rx="3" fill="#e8ffcf"/>
    <rect x="158" y="58" width="40" height="62" rx="5" fill="#8a4dff"/><rect x="164" y="66" width="28" height="22" rx="3" fill="#ffd6f2"/>
    <g transform="translate(250 30)">
      <rect x="10" y="38" width="40" height="52" rx="8" fill="#ffb347"/><circle cx="30" cy="22" r="22" fill="#ffcf8a"/>
      <circle cx="22" cy="20" r="4" fill="#1a1530"/><circle cx="38" cy="20" r="4" fill="#1a1530"/>
    </g>
  </g>

  <!-- luz do monitor na parede -->
  <ellipse cx="960" cy="470" rx="560" ry="260" fill="#6a4dff" opacity=".35" filter="url(#blur)"/>

  <!-- monitor ultrawide -->
  <g>
    <rect x="560" y="300" width="800" height="360" rx="16" fill="#05060c"/>
    <rect x="574" y="314" width="772" height="332" rx="8" fill="url(#game)"/>
    <!-- jogo na tela: sol, montanhas e um personagem -->
    <g clip-path="url(#screenClip)">
    <circle cx="1060" cy="470" r="70" fill="#ffd48a" opacity=".9"/>
    <path d="M574 560l120-90 90 60 110-110 130 120 90-60 120 90 110-70 102 70v76H574z" fill="#3c1c5c"/>
    <path d="M574 600l150-60 120 40 140-70 160 80 120-40 132 50v46H574z" fill="#24113f"/>
    <rect x="800" y="560" width="14" height="30" rx="3" fill="#ff3d9a"/><circle cx="807" cy="552" r="9" fill="#ffd27a"/>
    </g>
    <!-- interface do jogo -->
    <rect x="596" y="334" width="160" height="12" rx="6" fill="#000" opacity=".35"/><rect x="596" y="334" width="110" height="12" rx="6" fill="#3dffb5"/>
    <rect x="596" y="352" width="160" height="8" rx="4" fill="#000" opacity=".35"/><rect x="596" y="352" width="70" height="8" rx="4" fill="#00c8ff"/>
    <rect x="574" y="314" width="772" height="332" rx="8" fill="url(#glass)"/>
    <rect x="930" y="660" width="60" height="70" fill="#141729"/>
    <path d="M860 735h200l-14 14H874z" fill="#1d2138"/>
  </g>

  <!-- gabinete com vidro e fans RGB, à direita -->
  <g transform="translate(1440 400)">
    <ellipse cx="140" cy="200" rx="260" ry="240" fill="url(#glowCyan)" filter="url(#blur)" opacity=".75"/>
    <rect x="0" y="0" width="290" height="340" rx="14" fill="#0b0d18" stroke="#2a2f52" stroke-width="6"/>
    <circle cx="70" cy="80" r="52" fill="url(#fan)"/><circle cx="70" cy="80" r="16" fill="#1d2138"/>
    <circle cx="70" cy="190" r="52" fill="url(#fan)"/><circle cx="70" cy="190" r="16" fill="#1d2138"/>
    <circle cx="70" cy="295" r="40" fill="url(#fanC)"/><circle cx="70" cy="295" r="12" fill="#1d2138"/>
    <!-- placa de vídeo -->
    <rect x="140" y="180" width="136" height="44" rx="6" fill="#1d2138"/><rect x="146" y="214" width="124" height="5" rx="2" fill="url(#led)"/>
    <!-- memórias e cooler -->
    <rect x="150" y="50" width="10" height="70" rx="2" fill="#8a4dff"/><rect x="166" y="50" width="10" height="70" rx="2" fill="#00c8ff"/>
    <circle cx="232" cy="92" r="30" fill="#141729" stroke="#3dffb5" stroke-width="4"/>
    <rect x="0" y="0" width="290" height="340" rx="14" fill="url(#glass)"/>
  </g>

  <!-- mesa -->
  <rect x="0" y="740" width="1920" height="340" fill="url(#desk)"/>
  <rect x="0" y="740" width="1920" height="6" fill="#3a3f62" opacity=".7"/>
  <!-- fita de LED embaixo da mesa -->
  <rect x="0" y="792" width="1920" height="8" fill="url(#led)"/>
  <rect x="0" y="770" width="1920" height="60" fill="url(#led)" opacity=".4" filter="url(#blur)"/>

  <!-- teclado, mouse e mousepad -->
  <rect x="640" y="752" width="760" height="34" rx="8" fill="#14182b" stroke="#2a2f52" stroke-width="3"/>
  <rect x="700" y="758" width="420" height="22" rx="5" fill="#0b0d18"/>
  <g fill="url(#led)" opacity=".85">
    <rect x="708" y="762" width="404" height="4" rx="2"/><rect x="708" y="770" width="404" height="4" rx="2" opacity=".6"/>
  </g>
  <ellipse cx="1260" cy="768" rx="22" ry="12" fill="#1d2138" stroke="#00c8ff" stroke-width="2"/>

  <!-- controle de Xbox na mesa -->
  <g transform="translate(390 750)">
    <path d="M20 4h120c14 0 22 8 26 20l8 26c4 14-12 22-22 12l-16-14H44L28 62C18 72 2 64 6 50l8-26C18 12 6 4 20 4z" fill="#22263f" stroke="#343a5e" stroke-width="2"/>
    <circle cx="44" cy="24" r="9" fill="#14182b"/><circle cx="104" cy="38" r="8" fill="#14182b"/>
    <circle cx="132" cy="26" r="5" fill="#3dffb5"/><circle cx="142" cy="18" r="5" fill="#ff5a5a"/><circle cx="122" cy="18" r="5" fill="#00c8ff"/><circle cx="132" cy="10" r="5" fill="#ffd27a"/>
    <circle cx="80" cy="14" r="7" fill="#e9ecff" opacity=".85"/>
  </g>

  <!-- fone no suporte -->
  <g transform="translate(220 590)">
    <rect x="44" y="60" width="8" height="92" fill="#1d2138"/><rect x="20" y="148" width="56" height="8" rx="4" fill="#1d2138"/>
    <path d="M14 70a34 34 0 0 1 68 0" fill="none" stroke="#2a2f52" stroke-width="10"/>
    <rect x="4" y="64" width="22" height="40" rx="10" fill="#ff3d9a"/><rect x="70" y="64" width="22" height="40" rx="10" fill="#ff3d9a"/>
  </g>

  <!-- planta -->
  <g transform="translate(1790 600)">
    <path d="M30 0c-30 40-20 80 0 140M30 30c30 20 40 60 20 110M30 60c-40 10-50 50-34 80" stroke="#3dbb7a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="0" y="130" width="64" height="70" rx="10" fill="#2a2f52"/>
  </g>

  <!-- vinheta -->
  <rect width="1920" height="1080" fill="url(#glowM)" opacity=".25"/>
</svg>
