# Gera o instalador do Windows e publica numa Release do GitHub.
# Roda sozinho ao criar uma tag (v0.2.0, v0.3.0...) ou na mão pela aba Actions > Release > Run workflow.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # A Release precisa de uma tag. Rodando na mão pela aba Actions, a tag sai da versão do package.json (v0.2.0).
      - name: Criar a tag da versão
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "A tag $TAG já existe"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
      # O electron-builder só gera os arquivos. O envio fica com o gh, porque o envio do próprio electron-builder
      # às vezes cria a Release duas vezes ao mesmo tempo e perde o .exe no caminho.
      - name: Gerar o instalador
        run: npx electron-builder --win --publish never
      - name: Publicar na Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FILES=("dist/Cartucho-Setup-$VERSION.exe" "dist/Cartucho-Setup-$VERSION.exe.blockmap" "dist/latest.yml")
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "${FILES[@]}" --clobber
          else
            gh release create "v$VERSION" "${FILES[@]}" --title "$VERSION" --generate-notes
          fi
